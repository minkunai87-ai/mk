<style>

:0px solid var(--border)}#filter-bar-container.show{max-height:60px;border-bottom:1px solid var(--border)}.filter-scroll{display:flex;gap:8px;padding:10px 15px;overflow-x:auto;white-space:nowrap;align-items:center;scrollbar-width:none}.chip{padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:bold;background:var(--input-bg);color:var(--text-sub);border:1px solid var(--border);cursor:pointer;transition:.2s;flex-shrink:0}.chip.active{background:var(--primary);color:white;border-color:var(--primary)}.chip-sort{border-color:#444;color:#a0a0a0}.chip-sort.active{background:#343a40;color:#ffd43b;border-color:#ffd43b}.v-divider{width:1px;height:20px;background:#444;flex-shrink:0;margin:0 5px}.sidebar{position:fixed;top:0;left:0;width:300px;height:100%;background:var(--surface);border-right:1px solid var(--border);box-shadow:2px 0 15px rgba(0,0,0,.5);transition:transform .3s ease;z-index:9999;padding:25px;padding-top:calc(env(safe-area-inset-top) + 25px);display:flex;flex-direction:column;overflow-y:auto;transform:translateX(-105%)}.sidebar.open{transform:translateX(0)}.sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9998;display:none}.sidebar-overlay.open{display:block}.menu-section{margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:15px}.menu-label{font-weight:bold;color:var(--text-sub);margin-bottom:10px;display:block;font-size:.9rem}.search-input{width:100%;padding:12px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);border-radius:8px;font-size:.95rem;margin-bottom:10px}.deck-list,.tree-children{list-style:none;padding:0;margin:0}.tree-folder{margin-bottom:4px}.tree-header{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:8px;cursor:pointer;background:var(--input-bg);border:1px solid var(--border);margin-bottom:4px;transition:.2s;user-select:none}.tree-header:hover{background:var(--btn-hover)}.tree-header.active-deck{background:#182836;border:1px solid #1c7ed6}.tree-deck{padding:12px;border-radius:8px;cursor:pointer;background:var(--input-bg);margin-bottom:4px;color:var(--text);font-size:.9rem;display:flex;justify-content:space-between;align-items:center}.tree-deck.active{background:#182836;color:#74c0fc;font-weight:bold;border:1px solid #1c7ed6}.tree-children{display:none;padding-left:12px;margin-left:6px;border-left:2px solid #444}.tree-children.open{display:block!important}.folder-title{flex:1;font-weight:bold;color:#ffd43b;font-size:.95rem;display:flex;align-items:center;gap:6px}.play-btn{background:var(--primary);color:white;border:none;padding:4px 8px;border-radius:4px;font-size:.75rem;font-weight:bold;cursor:pointer;margin-left:8px;flex-shrink:0}.del-btn{background:none;border:none;color:#ff6b6b;font-weight:bold;padding:0 5px;cursor:pointer;font-size:1rem}.btn-sub{width:100%;padding:10px;border-radius:8px;background:var(--input-bg);color:var(--text-sub);border:1px solid var(--border);margin-top:5px;cursor:pointer;text-align:left;font-size:.85rem}.btn-cloud{width:100%;padding:12px;border-radius:8px;background:#2b1f11;color:#fab005;border:1px solid #fab005;font-weight:bold;cursor:pointer;margin-top:15px;text-align:center}.btn-refresh{width:100%;padding:12px;margin-top:15px;border-radius:8px;background:#343a40;color:#e9ecef;border:1px solid var(--border);font-weight:bold;cursor:pointer}.main-container{flex:1;display:flex;flex-direction:column;padding:0;width:100%;position:relative;overflow:hidden;background:var(--bg)}.card{background:var(--surface);width:100%;height:100%;max-width:none;border-radius:0;box-shadow:none;border:none;display:flex;flex-direction:column;position:relative;overflow:hidden}.card-scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;touch-action:pan-y;-webkit-overflow-scrolling:touch}.zoom-content{padding:25px 20px;min-height:100%;width:100%;transform-origin:0 0;will-change:transform}.card-info{display:flex;justify-content:space-between;width:100%;margin-bottom:15px;padding-bottom:10px;border-bottom:1px dashed var(--border);align-items:center}.rate-badge{font-size:.8rem;font-weight:bold;padding:4px 8px;border-radius:6px;background:var(--input-bg);color:var(--text-sub)}.rate-badge.high{background:#0b2e13!important;color:#69db7c!important}.rate-badge.low{background:#2e0b0b!important;color:#ff8787!important}.date-badge{font-size:.8rem;font-weight:bold;padding:4px 8px;border-radius:6px;margin-left:6px;background:var(--input-bg);color:var(--text-sub)}.date-badge.today{background:#1971c2;color:#e7f5ff}.date-badge.recent{background:#1098ad;color:#e3fafc}.icon-wrapper{display:flex;flex-direction:column;gap:5px;align-items:flex-end}.icon-row{display:flex;gap:12px}.icon-btn{font-size:1.4rem;cursor:pointer;background:none;border:none;padding:0;opacity:.4;filter:grayscale(100%);transition:.2s}.icon-btn.active{opacity:1;filter:grayscale(0%);transform:scale(1.1)}.mem-btn.active{color:#ff8787}.cmp-btn.active{color:#74c0fc}.fav-btn.active{color:#ffd43b}.rev-btn.active{color:#69db7c}.num-btn.active{color:#66d9e8}.date-btn.active{color:#b197fc}.pen-btn.active{color:#ff6b6b}.text-area{font-size:1.35rem;line-height:1.6;word-break:keep-all;white-space:pre-wrap;width:100%;margin-bottom:20px;position:relative}.text-area *{max-width:100%!important;box-sizing:border-box!important}table{width:100%!important;table-layout:fixed!important;display:table!important}td,th{word-wrap:break-word;overflow-wrap:break-word}.text-area img,.text-area svg{width:auto!important;height:auto!important;max-width:100%!important;display:block;margin:10px auto;border-radius:8px}.divider{display:none;border:0;border-top:2px dashed var(--border);margin:30px 0;position:relative}.divider::after{content:"정답";position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--surface);padding:0 10px;color:var(--text-sub);font-size:.8rem;font-weight:bold}#answer-section{display:none;padding-bottom:20px}.footer{width:100%;padding:10px 20px;padding-bottom:calc(35px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);z-index:10;display:flex;flex-direction:column;gap:10px;justify-content:center}.nav-btns,.grade-btns{display:flex;justify-content:space-between;gap:12px}.nav-btn,.g-btn{flex:1;padding:14px 0;border-radius:12px;font-weight:bold;cursor:pointer;font-size:1rem;text-align:center;border:none}.nav-btn{background:var(--input-bg);color:var(--text);border:1px solid var(--border)}.bg-x{background:#fa5252;color:white}.bg-tri{background:#fab005;color:white}.bg-o{background:#40c057;color:white}.click-guide{text-align:center;color:var(--text-sub);font-size:.9rem;margin-top:40px;cursor:pointer;padding:30px;border:2px dashed var(--border);border-radius:12px;background:#181818}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:10000;display:none;align-items:center;justify-content:center}.modal-content{background:var(--surface);width:90%;max-width:500px;padding:25px;border-radius:15px;display:flex;flex-direction:column;gap:15px;border:1px solid var(--border)}.edit-input{width:100%;padding:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);border-radius:8px;font-size:1rem}.modal-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}.modal-btn{padding:10px 20px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}.btn-save{background:#fab005;color:#121212}.btn-cancel{background:var(--input-bg);color:var(--text)}.backup-list{max-height:250px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-top:10px;background:var(--input-bg)}.backup-item{padding:12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;font-size:.9rem}.backup-item:hover{background:var(--btn-hover)}.backup-date{color:#fab005;font-weight:bold}#toast{position:fixed;bottom:-60px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 24px;border-radius:25px;font-size:.95rem;font-weight:bold;transition:bottom .3s ease;z-index:20000;box-shadow:0 5px 15px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;pointer-events:none}#toast.show{bottom:85px}#toast.error{background:#fa5252}#toast.success{background:#40c057}
</style>
</head>
<body>
    <div id="toast">알림</div>
    <div class="sidebar-overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <h2 style="margin-top:0; color:var(--text); font-size:1.4rem;">⚙️ 메뉴</h2>
        <div class="menu-section">
            <input type="text" id="search-input" class="search-input" placeholder="검색어 입력" onkeyup="filterCards('search')">
        </div>
        <ul class="deck-list" id="deck-list-ui"></ul>
        <div style="margin-top:30px; border-top:1px solid var(--border); padding-top:20px;">
            <button class="btn-sub" onclick="exportData()">💾 로컬 백업 저장</button>
            <button class="btn-sub" onclick="document.getElementById('backup-input').click()">📂 로컬 백업 불러오기</button>
            <input type="file" id="backup-input" accept=".json" style="display:none" onchange="importData(this)">
            <button class="btn-cloud" onclick="openFirebaseSettings()">🔥 자동 동기화 설정</button>
            <div id="fb-status-text" style="font-size:0.8rem; color:#fab005; text-align:center; margin-top:5px; font-weight:bold;">⚡️ 서버 연결 준비됨</div>
            <button class="btn-refresh" onclick="location.reload()">🔄 새로고침</button>
        </div>
    </div>
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="header-title-area">
            <div class="header-title"><span id="deck-title-text">나만의 안키</span><span id="cloud-icon" class="cloud-icon">🔥</span></div>
            <div class="header-subtitle" id="header-info">🔥 틀린 순 & 📁 전체</div>
        </div>
        <div class="header-controls">
            <button class="today-toggle-btn active" id="today-toggle-btn" onclick="toggleTodayView()">👁️</button>
            <button class="filter-toggle-btn" id="filter-toggle-btn" onclick="toggleFilterBar()">🌪️</button>
            <span class="counter" id="card-counter">0 / 0</span>
        </div>
    </div>
    <div id="filter-bar-container">
        <div class="filter-scroll">
            <div class="chip chip-sort" id="chip-sort-wrong" onclick="setSortMode('wrong')">🔥 틀린순</div>
            <div class="chip chip-sort" id="chip-sort-normal" onclick="setSortMode('normal')">📋 원래순</div>
            <div class="chip chip-sort" id="chip-sort-random" onclick="setSortMode('random')">🎲 랜덤</div>
            <div class="v-divider"></div>
            <div class="chip active" id="chip-default" onclick="filterCards('default')">📁 전체</div>
            <div class="chip" id="chip-rev" onclick="filterCards('rev')">🔄 복습</div>
            <div class="chip" id="chip-fav" onclick="filterCards('fav')">⭐ 중요</div>
        </div>
    </div>
    <div class="main-container">
        <div class="card">
            <div class="card-scroll-area" id="scroll-area">
                <div class="zoom-content" id="zoom-content">
                    <div id="loading" style="text-align:center; padding:20px; display:none;">로딩 중...</div>
                    <div class="card-info" id="card-info" style="display:none;">
                        <div><span class="rate-badge" id="rate-badge">New</span><span class="date-badge" id="date-badge" style="display:none;"></span></div>
                        <div class="icon-wrapper">
                            <div class="icon-row">
                                <button class="icon-btn rev-btn" id="rev-btn" onclick="toggleTag(event, 'rev')">🔄</button>
                                <button class="icon-btn mem-btn" id="mem-btn" onclick="toggleTag(event, 'mem')">🧠</button>
                                <button class="icon-btn cmp-btn" id="cmp-btn" onclick="toggleTag(event, 'cmp')">🆚</button>
                                <button class="icon-btn fav-btn" id="fav-btn" onclick="toggleTag(event, 'fav')">⭐</button>
                            </div>
                        </div>
                    </div>
                    <div id="question-section" class="content-box text-area"></div>
                    <div id="click-guide" class="click-guide" onclick="revealAnswer(event)">👇 터치하여 정답 확인</div>
                    <hr id="divider" class="divider">
                    <div id="answer-section" class="content-box text-area"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="grade-btns" id="grade-area" style="display:none;">
            <button class="g-btn bg-x" onclick="grade(0)">모름</button>
            <button class="g-btn bg-tri" onclick="grade(1)">애매</button>
            <button class="g-btn bg-o" onclick="grade(2)">맞음</button>
        </div>
        <div class="nav-btns" id="nav-area">
            <button class="nav-btn" onclick="moveCard(-1)">◀ 이전</button>
            <button class="nav-btn" onclick="moveCard(1)">다음 ▶</button>
        </div>
    </div>
    <div class="modal-overlay" id="fb-modal">
        <div class="modal-content">
            <div class="modal-title">🔥 파이어베이스 백업 센터</div>
            <div id="fb-auth-section">
                <input type="text" id="gh-token-input" class="edit-input" placeholder="ghp_... (비공개 덱 토큰)">
                <div class="modal-btns">
                    <button class="modal-btn btn-save" onclick="testFirebaseSync()">수동 백업</button>
                    <button class="modal-btn btn-sub" onclick="fetchFirebaseList()">내역 보기</button>
                    <button class="modal-btn btn-cancel" onclick="document.getElementById('fb-modal').style.display='none'">닫기</button>
                </div>
            </div>
            <div id="fb-list-section" style="display:none;">
                <div id="fb-list-ui" class="backup-list"></div>
                <div class="modal-btns"><button class="modal-btn btn-cancel" onclick="document.getElementById('fb-auth-section').style.display='block'; document.getElementById('fb-list-section').style.display='none';">뒤로</button></div>
            </div>
        </div>
    </div>

<script>
    const FIREBASE_DB_URL = "https://mkapp-87823-default-rtdb.firebaseio.com";
    let ghRepoToken = localStorage.getItem('gh_repo_token') || '';
    const defaultRepoOwner = 'minkunai87-ai'; const defaultRepoName = 'mk';
    let showTodayCompleted = localStorage.getItem('anki_show_today') !== 'false', lastBackupTime = 0, isDataChanged = false;
    const BACKUP_INTERVAL = 10 * 60 * 1000;

    function showToast(msg, type='normal') { const t = document.getElementById('toast'); t.innerText=msg; t.className=''; if(type==='error')t.classList.add('error'); if(type==='success')t.classList.add('success'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); }

    let library={}, currentDeckName=null, originalDeck=[], activeDeck=[], currentIndex=0, currentFilterType='default', currentSortMode='wrong';
    const sortLabels={'wrong':'🔥 틀린 순','normal':'📋 원래 순','random':'🎲 랜덤'}, filterLabels={'default':'📁 전체','fav':'⭐ 중요','mem':'🧠 암기','cmp':'🆚 비교','num':'🔢 숫자','date':'📅 날짜','pen':'🚨 벌칙','rate_asc':'🔥 오답','search':'🔍 검색','rev':'🔄 복습'};
    const S_LIB='anki_final_library', S_STAT='anki_final_stats', S_PROG='anki_final_progress', S_LAST='anki_final_last_deck', S_GRP='anki_final_is_group', S_SORT='anki_final_sort_mode';

    window.onload = function() { currentSortMode=localStorage.getItem(S_SORT)||'wrong'; updateHeaderUI(); updateTodayToggleUI(); loadLocalLibrary(); if(location.protocol.startsWith('http')) autoScanGitHub(); restoreLastSession(); document.getElementById('loading').style.display='none'; if((!activeDeck||activeDeck.length===0)&&Object.keys(library).length===0) document.getElementById('question-section').innerHTML="<h3 style='color:#aaa;text-align:center;'>메뉴를 열어 덱을 선택하세요.</h3>"; };

    function toggleMenu(force) { const s=document.getElementById('sidebar'), o=document.querySelector('.sidebar-overlay'), isOpen=force!==undefined?force:!s.classList.contains('open'); if(isOpen){ s.classList.add('open'); o.classList.add('open'); } else { s.classList.remove('open'); o.classList.remove('open'); } }
    function toggleFilterBar() { document.getElementById('filter-bar-container').classList.toggle('show'); document.getElementById('filter-toggle-btn').classList.toggle('active'); }
    function toggleTodayView() { showTodayCompleted=!showTodayCompleted; localStorage.setItem('anki_show_today', showTodayCompleted); updateTodayToggleUI(); if(currentDeckName) filterCards(currentFilterType); }
    function updateTodayToggleUI() { const b=document.getElementById('today-toggle-btn'); if(showTodayCompleted){b.innerText="👁️";b.className="today-toggle-btn active";}else{b.innerText="🙈";b.className="today-toggle-btn hidden";} }

    function openFirebaseSettings() { document.getElementById('gh-token-input').value=ghRepoToken; document.getElementById('fb-auth-section').style.display='block'; document.getElementById('fb-list-section').style.display='none'; document.getElementById('fb-modal').style.display='flex'; }
    function updateCloudIcon(status) { const icon=document.getElementById('cloud-icon'); if(!icon)return; icon.className=`cloud-icon ${status}`; icon.innerText=status==='active'?'🔄':(status==='error'?'❌':'🔥'); }

    function testFirebaseSync() { document.getElementById('fb-modal').style.display='none'; ghRepoToken=document.getElementById('gh-token-input').value.trim(); localStorage.setItem('gh_repo_token', ghRepoToken); isDataChanged=true; performFirebaseBackup(false); }
    function checkAutoBackup() { if(!isDataChanged)return; const now=Date.now(); if(now-lastBackupTime>=BACKUP_INTERVAL){ lastBackupTime=now; performFirebaseBackup(true); } }
    function performFirebaseBackup(isAuto) {
        updateCloudIcon('active'); const now=Date.now(), data={stats:localStorage.getItem(S_STAT), progress:localStorage.getItem(S_PROG), lastDeck:localStorage.getItem(S_LAST), timestamp:now};
        fetch(`${FIREBASE_DB_URL}/backups/${now}.json`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) })
        .then(res => { if(res.ok){ isDataChanged=false; updateCloudIcon('done'); if(!isAuto) showToast("🚀 수동 저장 완료!", "success"); } else { updateCloudIcon('error'); if(!isAuto) showToast("❌ 저장 실패", "error"); } })
        .catch(e => { updateCloudIcon('error'); if(!isAuto) showToast("❌ 통신 차단됨", "error"); });
    }

    function fetchFirebaseList() {
        document.getElementById('fb-auth-section').style.display='none'; document.getElementById('fb-list-section').style.display='block'; const ui=document.getElementById('fb-list-ui'); ui.innerHTML='로딩중...';
        fetch(`${FIREBASE_DB_URL}/backups.json?shallow=true&_t=${Date.now()}`).then(r=>r.json()).then(d=>{
            if(!d) { ui.innerHTML='내역 없음'; return; }
            ui.innerHTML=''; Object.keys(d).sort((a,b)=>b-a).slice(0,30).forEach(ts=>{
                const item=document.createElement('div'); item.className='backup-item'; const date=new Date(parseInt(ts));
                item.innerHTML=`<span><span class="backup-date">🕒 ${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}</span></span>`;
                item.onclick=()=>{ restoreFromFirebase(ts); }; ui.appendChild(item);
            });
        }).catch(e=>{ ui.innerHTML='실패'; });
    }
    function restoreFromFirebase(ts) { fetch(`${FIREBASE_DB_URL}/backups/${ts}.json`).then(r=>r.json()).then(d=>{ if(d.stats) localStorage.setItem(S_STAT, d.stats); if(d.progress) localStorage.setItem(S_PROG, d.progress); if(d.lastDeck) localStorage.setItem(S_LAST, d.lastDeck); location.reload(); }); }

    async function autoScanGitHub() {
        const headers = ghRepoToken ? { 'Authorization': `token ${ghRepoToken}` } : {};
        try {
            const res = await fetch(`https://api.github.com/repos/${defaultRepoOwner}/${defaultRepoName}/contents/`, { headers }); if(!res.ok)return;
            const files = await res.json(); const txtFiles = files.filter(f=>f.name.endsWith('.txt')); if(txtFiles.length===0)return;
            let newLib = {};
            for(const file of txtFiles) {
                let text = ""; if(ghRepoToken){ const fRes=await fetch(file.url,{headers}); const fJson=await fRes.json(); if(fJson.content) text=u_atob(fJson.content.replace(/\n/g,'')); } else { const cRes=await fetch(file.download_url+'?t='+Date.now()); text=await cRes.text(); }
                const rows=parseAnkiRawData(text), curDeck=file.name.replace('.txt','');
                rows.forEach(fields=>{
                    if(fields.length>0&&fields[0].startsWith('#'))return; let dName=null, q="", a="";
                    if(fields.length>=3){ dName=fields[0].replace(/::/g,'__'); q=fields[1]; a=fields.slice(2).join('<br>'); } else { dName=curDeck; if(fields.length===2){q=fields[0];a=fields[1];}else if(fields.length>0){q=fields[0];a=fields.slice(1).join('<br>');} }
                    if(!q)return; if(!newLib[dName]) newLib[dName]=[]; newLib[dName].push({id:cyrb53(q),q,a});
                });
            }
            library=newLib; saveLibrary(); renderDeckTree(); restoreLastSession();
        } catch(e){}
    }

    function u_btoa(str){return window.btoa(unescape(encodeURIComponent(str)));} function u_atob(str){return decodeURIComponent(escape(window.atob(str)));}
    function parseAnkiRawData(str){ const rows=[]; let row=[], cell='', cursor=0, inQuote=false; while(cursor<str.length){ const char=str[cursor], nextChar=str[cursor+1]; if(inQuote){ if(char==='"'&&nextChar==='"'){ cell+='"'; cursor+=2; }else if(char==='"'){ inQuote=false; cursor++; }else{ cell+=char; cursor++; } }else{ if(char==='"'){ inQuote=true; cursor++; }else if(char==='\t'){ row.push(cell); cell=''; cursor++; }else if(char==='\n'||char==='\r'){ if(char==='\r'&&nextChar==='\n') cursor++; row.push(cell); if(row.length>1||(row.length===1&&row[0].trim()!=='')) rows.push(row); row=[]; cell=''; cursor++; }else{ cell+=char; cursor++; } } } if(row.length>0||cell!==''){ row.push(cell); rows.push(row); } return rows; }
    function saveLibrary(){ localStorage.setItem(S_LIB, JSON.stringify(library)); } function loadLocalLibrary(){ const s=localStorage.getItem(S_LIB); if(s){ try{library=JSON.parse(s);renderDeckTree();}catch(e){} } }

    function showCard() {
        resetZoom(); if(!activeDeck||activeDeck.length===0){ document.getElementById('question-section').innerHTML="<h3 style='color:#aaa;text-align:center;'>항목이 없습니다.</h3>"; document.getElementById('card-info').style.display='none'; return; }
        if(currentIndex>=activeDeck.length) currentIndex=0; const card=activeDeck[currentIndex], stats=getStats(card.id);
        document.getElementById('card-counter').innerText=`${currentIndex+1} / ${activeDeck.length}`; document.getElementById('card-info').style.display='flex'; updateStatsUI(stats); updateIconsUI(stats);
        const dBadge=document.getElementById('date-badge'), dText=getDaysText(stats); if(dText){ dBadge.innerText=dText; dBadge.style.display='inline-block'; dBadge.className=dText.includes('오늘')?'date-badge today':'date-badge recent'; }else dBadge.style.display='none';
        const qSec=document.getElementById('question-section'); qSec.innerHTML=''; qSec.appendChild(createDOM(card.q));
        const aSec=document.getElementById('answer-section'); aSec.innerHTML=''; aSec.appendChild(createDOM(card.a));
        aSec.style.display='none'; document.getElementById('divider').style.display='none'; document.getElementById('click-guide').style.display='block'; document.getElementById('nav-area').style.display='flex'; document.getElementById('grade-area').style.display='none'; scrollContainer.scrollTop=0;
    }

    function revealAnswer(e){ if(e)e.stopPropagation(); document.getElementById('click-guide').style.display='none'; document.getElementById('divider').style.display='block'; document.getElementById('answer-section').style.display='block'; document.getElementById('grade-area').style.display='flex'; setTimeout(()=>document.getElementById('answer-section').scrollIntoView({behavior:'smooth',block:'start'}), 50); }
    function filterCards(type){ if(!currentDeckName)return; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); const chip=document.getElementById(`chip-${type}`); if(chip)chip.classList.add('active'); if(type==='search'){ const rawQuery=document.getElementById('search-input').value.toLowerCase(); if(!rawQuery) activeDeck=[...originalDeck]; else activeDeck=originalDeck.filter(c=>c.q.toLowerCase().includes(rawQuery)||c.a.toLowerCase().includes(rawQuery)); }else{ currentFilterType=type; const allStats=JSON.parse(localStorage.getItem(S_STAT)||'{}'); let newDeck=[...originalDeck]; if(type==='rate_asc') newDeck=newDeck.filter(c=>{ const s=allStats[c.id]||{correct:0,total:0}; return s.total>0&&(s.correct/s.total)<0.8; }); else if(type!=='default') newDeck=newDeck.filter(c=>(allStats[c.id]||{})[type]); if(!showTodayCompleted){ const today=new Date(); today.setHours(4,0,0,0); newDeck=newDeck.filter(c=>(allStats[c.id]||{}).last<today.getTime()); } activeDeck=newDeck; } applySort(); updateHeaderUI(); currentIndex=JSON.parse(localStorage.getItem(S_PROG)||'{}')[`${currentDeckName}__${currentFilterType}`]||0; showCard(); }
    
    function renderDeckTree() {
        const list=document.getElementById('deck-list-ui'); list.innerHTML=''; const names=Object.keys(library).sort(); if(names.length===0)return; const tree={}; names.forEach(path=>{ const parts=path.split('__'); let cur=tree; parts.forEach((part,i)=>{ if(!cur[part]) cur[part]={_name:part,_fullPath:parts.slice(0,i+1).join('__'),_children:{},_isLeaf:false}; if(i===parts.length-1&&library[path]&&library[path].length>0) cur[part]._isLeaf=true; cur=cur[part]._children; }); });
        function createTreeDOM(node,container){ Object.keys(node).sort().forEach(k=>{ const item=node[k], hasChildren=Object.keys(item._children).length>0; if(hasChildren){ const isOpen=(currentDeckName&&currentDeckName.startsWith(item._fullPath))?'open':'', isActive=(currentDeckName===item._fullPath)?'active-deck':'', html=`<li class="tree-folder"><div class="tree-header ${isActive}" onclick="this.nextElementSibling.classList.toggle('open')"><div class="folder-title">📂 ${item._name}</div><button class="play-btn" onclick="event.stopPropagation(); selectDeckGroup('${item._fullPath}__')">▶ 전체</button></div><ul class="tree-children ${isOpen}"></ul></li>`, li=document.createElement('div'); li.innerHTML=html; container.appendChild(li.firstElementChild); createTreeDOM(item._children,container.lastElementChild.querySelector('ul')); }else{ const isActive=(item._fullPath===currentDeckName)?'active':'', html=`<li class="tree-item"><div class="tree-deck ${isActive}" onclick="selectDeck('${item._fullPath}')"><span>📄 ${item._name} <small>(${library[item._fullPath].length})</small></span><button class="del-btn" onclick="event.stopPropagation(); deleteDeck('${item._fullPath}')">x</button></div></li>`, li=document.createElement('div'); li.innerHTML=html; container.appendChild(li.firstElementChild); } }); } createTreeDOM(tree,list);
    }
    
    function selectDeckGroup(prefix){ let m=[]; const target=prefix.replace(/__$/,''); Object.keys(library).forEach(k=>{ if(k.startsWith(prefix)||k===target)m=m.concat(library[k]); }); if(m.length===0)return; currentDeckName=target; originalDeck=m; activeDeck=[...originalDeck]; localStorage.setItem(S_LAST,currentDeckName); localStorage.setItem(S_GRP,'true'); filterCards('default'); document.getElementById('deck-title-text').innerText=`📂 ${currentDeckName.split('__').pop()}`; renderDeckTree(); toggleMenu(false); }
    function selectDeck(name){ if(!library[name])return; currentDeckName=name; originalDeck=library[name]; activeDeck=[...originalDeck]; localStorage.setItem(S_LAST,name); localStorage.setItem(S_GRP,'false'); filterCards('default'); document.getElementById('deck-title-text').innerText=`📄 ${name.split('__').pop()}`; renderDeckTree(); toggleMenu(false); }
    function restoreLastSession(){ const last=localStorage.getItem(S_LAST); if(last&&(library[last]||Object.keys(library).some(k=>k.startsWith(last)))){ if(localStorage.getItem(S_GRP)==='true') selectDeckGroup(last.endsWith('__')?last:last+'__'); else selectDeck(last); } }
    function getStats(id){ return {correct:0,total:0,fav:false,mem:false,cmp:false,num:false,date:false,pen:false,rev:false,last:0,...(JSON.parse(localStorage.getItem(S_STAT)||'{}')[id]||{})}; }
    function toggleTag(e,type){ e.stopPropagation(); const c=activeDeck[currentIndex], all=JSON.parse(localStorage.getItem(S_STAT)||'{}'), s=getStats(c.id); s[type]=!s[type]; all[c.id]=s; localStorage.setItem(S_STAT,JSON.stringify(all)); updateIconsUI(s); isDataChanged=true; checkAutoBackup(); }
    function updateStatsUI(s){ const b=document.getElementById('rate-badge'); if(!b)return; if(s.total===0){b.innerText="New";b.className="rate-badge";}else{const r=Math.round((s.correct/s.total)*100); b.innerText=`${r}% (${s.total}회)`; b.className=r>=80?"rate-badge high":r<50?"rate-badge low":"rate-badge";} }
    function updateIconsUI(s){ ['mem','cmp','fav','rev','num','date','pen'].forEach(k=>{ const e=document.getElementById(k+'-btn'); if(e)e.classList.toggle('active',!!s[k]); }); }
    function exportData(){ const d={stats:localStorage.getItem(S_STAT),progress:localStorage.getItem(S_PROG),lastDeck:localStorage.getItem(S_LAST)}, b=new Blob([JSON.stringify(d)],{type:"application/json"}), dt=new Date(), a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`${dt.getFullYear()}_${String(dt.getMonth()+1).padStart(2,'0')}${String(dt.getDate()).padStart(2,'0')}_${String(dt.getHours()).padStart(2,'0')}${String(dt.getMinutes()).padStart(2,'0')}.json`; a.click(); }
    function importData(input){ const f=input.files[0]; if(!f)return; const r=new FileReader(); r.onload=(e)=>{try{const d=JSON.parse(e.target.result); if(d.stats)localStorage.setItem(S_STAT,d.stats); if(d.progress)localStorage.setItem(S_PROG,d.progress); if(d.lastDeck)localStorage.setItem(S_LAST,d.lastDeck); location.reload();}catch(err){}}; r.readAsText(f); }
    function deleteDeck(name){ if(confirm("삭제?")){ delete library[name]; saveLibrary(); renderDeckTree(); if(currentDeckName===name){currentDeckName=null;activeDeck=[];showCard();} } }
    function moveCard(delta){ let n=currentIndex+delta; if(n>=0&&n<activeDeck.length){ currentIndex=n; saveProgress(); showCard(); } }
    function grade(sc){ const c=activeDeck[currentIndex], d=JSON.parse(localStorage.getItem(S_STAT)||'{}'), s={correct:0,total:0,...d[c.id]}; s.total++; if(sc===2)s.correct++;else if(sc===1)s.correct+=0.5; s.last=Date.now(); d[c.id]=s; localStorage.setItem(S_STAT,JSON.stringify(d)); updateStatsUI(s); isDataChanged=true; checkAutoBackup(); if(!showTodayCompleted){ activeDeck=activeDeck.filter(x=>x.id!==c.id); if(currentIndex>=activeDeck.length)currentIndex=0; if(activeDeck.length===0){showCard();return;} saveProgress(); showCard(); }else{ if(currentIndex<activeDeck.length-1){currentIndex++;saveProgress();showCard();}else{currentIndex=0;saveProgress();showCard();} } }
    function saveProgress(){ const p=JSON.parse(localStorage.getItem(S_PROG)||'{}'); p[`${currentDeckName}__${currentFilterType}`]=currentIndex; localStorage.setItem(S_PROG,JSON.stringify(p)); }
    function updateHeaderUI(){ const h=document.getElementById('header-info'); if(h)h.innerText=`${sortLabels[currentSortMode]} & ${filterLabels[currentFilterType]}`; ['wrong','normal','random'].forEach(m=>{const e=document.getElementById(`chip-sort-${m}`); if(e)e.classList.toggle('active',currentSortMode===m);}); }
    function setSortMode(m){ currentSortMode=m; localStorage.setItem(S_SORT,m); updateHeaderUI(); if(currentDeckName){ applySort(); currentIndex=0; showCard(); } }
    function applySort(){ if(!activeDeck||activeDeck.length===0)return; const all=JSON.parse(localStorage.getItem(S_STAT)||'{}'); if(currentSortMode==='wrong'){ activeDeck.sort((a,b)=>{const sA=all[a.id]||{correct:0,total:0}, sB=all[b.id]||{correct:0,total:0}, rA=sA.total===0?0:sA.correct/sA.total, rB=sB.total===0?0:sB.correct/sB.total; return (rA-rB)||(sA.total-sB.total);}); }else if(currentSortMode==='random') activeDeck.sort(()=>Math.random()-0.5); }
    function getDaysText(s){ if(!s||!s.last)return""; const diff=new Date().setHours(4,0,0,0)-s.last; return diff<0?"✅ 오늘 완료":`🕒 ${Math.floor(diff/86400000)+1}일 전`; }
    
    // 🔥 [핵심 추가] 비공개 레포지토리의 이미지를 토큰으로 몰래 가져오는 투시 로직!
    function createDOM(rawText) { 
        if(!rawText) rawText=""; 
        let clean=rawText.replace(/""/g,'"').replace(/title=".*?"/g,'').replace(/\{\{c\d+::(.*?)\}\}/g,'<span style="display:none">$1</span>'); 
        if(clean.startsWith('"')&&clean.endsWith('"')) clean=clean.slice(1,-1); 
        const div=document.createElement('div'); div.innerHTML=clean; 
        
        div.querySelectorAll('img').forEach(img => { 
            let src=img.getAttribute('src'); 
            if(src && !src.startsWith('http') && defaultRepoOwner) {
                const fname = encodeURIComponent(src.split('/').pop());
                
                // 1. 이미지를 불러오지 못하면 그냥 투명하게 숨겨버림
                img.onerror = function() { this.style.display = 'none'; };

                // 2. 토큰이 있으면 깃허브 API로 이미지의 base64 코드를 빼내옴
                if(ghRepoToken) {
                    fetch(`https://api.github.com/repos/${defaultRepoOwner}/${defaultRepoName}/contents/images/${fname}`, {
                        headers: { 'Authorization': `token ${ghRepoToken}` }
                    })
                    .then(res => res.ok ? res.json() : Promise.reject())
                    .then(data => {
                        // 빼내온 코드를 이미지 소스(src)에 강제로 꽂아 넣음!
                        img.src = `data:image/png;base64,${data.content.replace(/\n/g, '')}`;
                    })
                    .catch(() => { img.style.display = 'none'; }); // 실패하면 숨김
                } else {
                    // 토큰이 없으면 그냥 일반 주소로 찌름 (공개 레포용)
                    img.src = `https://raw.githubusercontent.com/${defaultRepoOwner}/${defaultRepoName}/main/images/${fname}`;
                }
            } else if (src && src.startsWith('http')) {
                img.onerror = function() { this.style.display = 'none'; };
            }
        }); 
        return div; 
    }
    
    const cyrb53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
</script>
