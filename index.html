<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>나만의 안키 (v10.85 - Auto Backup)</title>
<style>
    /* v10.77 디자인 100% 유지 */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --primary: #4dabf7; --bg: #121212; --surface: #1e1e1e; --text: #e0e0e0; --text-sub: #a0a0a0; --border: #333333; --input-bg: #2c2c2c; }
    body { font-family: 'Apple SD Gothic Neo', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    
    .header { background: var(--surface); padding: 0 20px; padding-top: calc(env(safe-area-inset-top) + 12px); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; flex-shrink: 0; }
    .header-title { font-weight: bold; font-size: 1.1rem; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
    .header-subtitle { font-size: 0.75rem; color: var(--primary); margin-top: 3px; font-weight: bold; }
    .header-controls { display: flex; gap: 12px; align-items: center; }
    
    .cloud-icon { font-size: 0.8rem; opacity: 0.5; transition: 0.3s; }
    .cloud-icon.active { color: #ffd43b; opacity: 1; animation: spin 1s infinite linear; }
    .cloud-icon.done { color: #40c057; opacity: 1; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .menu-btn, .filter-toggle-btn, .today-toggle-btn { font-size: 1.3rem; cursor: pointer; background: none; border: none; padding: 0; color: var(--text-sub); transition: 0.2s; }
    .menu-btn { font-size: 1.5rem; color: var(--text); }
    .filter-toggle-btn.active { color: var(--primary); transform: scale(1.1); }
    .today-toggle-btn.active { color: #40c057; } 
    .today-toggle-btn.hidden { color: #fa5252; opacity: 0.7; }
    .counter { font-size: 0.8rem; font-weight: bold; color: var(--text-sub); background: var(--input-bg); padding: 4px 10px; border-radius: 12px; }

    #filter-bar-container { background: var(--surface); max-height: 0; overflow: hidden; transition: max-height 0.3s ease-in-out, border-bottom 0.1s; border-bottom: 0px solid var(--border); }
    #filter-bar-container.show { max-height: 60px; border-bottom: 1px solid var(--border); }
    .filter-scroll { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; white-space: nowrap; align-items: center; scrollbar-width: none; }
    .chip { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; background: var(--input-bg); color: var(--text-sub); border: 1px solid var(--border); cursor: pointer; transition: 0.2s; flex-shrink: 0; }
    .chip.active { background: var(--primary); color: white; border-color: var(--primary); }
    .v-divider { width: 1px; height: 20px; background: #444; flex-shrink: 0; margin: 0 5px; }

    .sidebar { position: fixed; top: 0; left: 0; width: 300px; height: 100%; background: var(--surface); border-right: 1px solid var(--border); box-shadow: 2px 0 15px rgba(0,0,0,0.5); transition: transform 0.3s ease; z-index: 9999; padding: 25px; padding-top: calc(env(safe-area-inset-top) + 25px); display: flex; flex-direction: column; overflow-y: auto; transform: translateX(-105%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9998; display: none; }
    .sidebar-overlay.open { display: block; }
    .menu-section { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .menu-label { font-weight: bold; color: var(--text-sub); margin-bottom: 10px; display: block; font-size: 0.9rem; }
    .search-input { width: 100%; padding: 12px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 8px; font-size: 0.95rem; margin-bottom: 10px; }

    .deck-list, .tree-children { list-style: none; padding: 0; margin: 0; }
    .tree-folder { margin-bottom: 4px; }
    .tree-header { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 8px; cursor: pointer; background: var(--input-bg); border: 1px solid var(--border); margin-bottom: 4px; }
    .tree-deck { padding: 12px; border-radius: 8px; cursor: pointer; background: var(--input-bg); margin-bottom: 4px; color: var(--text); font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .tree-deck.active { background: #182836; color: #74c0fc; font-weight: bold; border: 1px solid #1c7ed6; }
    .tree-children { display: none; padding-left: 12px; margin-left: 6px; border-left: 2px solid #444; }
    .tree-children.open { display: block !important; }
    .folder-title { flex: 1; font-weight: bold; color: #ffd43b; font-size: 0.95rem; }
    .play-btn { background: var(--primary); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; margin-left: 8px; }
    .del-btn { background: none; border: none; color: #ff6b6b; font-weight: bold; padding: 0 5px; cursor: pointer; font-size: 1rem; }

    .btn-sub { width: 100%; padding: 10px; border-radius: 8px; background: var(--input-bg); color: var(--text-sub); border: 1px solid var(--border); margin-top: 5px; cursor: pointer; text-align: left; font-size: 0.85rem; }
    .btn-cloud { width: 100%; padding: 12px; border-radius: 8px; background: #24292e; color: white; border: 1px solid #444; font-weight: bold; cursor: pointer; margin-top: 15px; text-align: center; }
    .btn-refresh { width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; background: #343a40; color: #e9ecef; border: 1px solid var(--border); font-weight: bold; cursor: pointer; }

    .main-container { flex: 1; display: flex; flex-direction: column; padding: 0; width: 100%; position: relative; overflow: hidden; background: var(--bg); }
    .card { background: var(--surface); width: 100%; height: 100%; max-width: none; border-radius: 0; box-shadow: none; border: none; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .card-scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
    .zoom-content { padding: 25px 20px; min-height: 100%; width: 100%; transform-origin: 0 0; will-change: transform; }
    
    .card-info { display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); align-items: center; }
    .rate-badge { font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; background: var(--input-bg); color: var(--text-sub); }
    .rate-badge.high { background: #0b2e13 !important; color: #69db7c !important; } .rate-badge.low { background: #2e0b0b !important; color: #ff8787 !important; }
    .date-badge { font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; margin-left: 6px; background: var(--input-bg); color: var(--text-sub); }
    .date-badge.today { background: #1971c2; color: #e7f5ff; } .date-badge.recent { background: #1098ad; color: #e3fafc; }

    .icon-wrapper { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
    .icon-row { display: flex; gap: 12px; }
    .icon-btn { font-size: 1.4rem; cursor: pointer; background: none; border: none; padding: 0; opacity: 0.4; filter: grayscale(100%); transition: 0.2s; }
    .icon-btn.active { opacity: 1; filter: grayscale(0%); transform: scale(1.1); }
    .mem-btn.active { color: #ff8787; } .cmp-btn.active { color: #74c0fc; } .fav-btn.active { color: #ffd43b; } .rev-btn.active { color: #69db7c; }
    .num-btn.active { color: #66d9e8; } .date-btn.active { color: #b197fc; } .pen-btn.active { color: #ff6b6b; }

    .text-area { font-size: 1.35rem; line-height: 1.6; word-break: keep-all; white-space: pre-wrap; width: 100%; margin-bottom: 20px; position: relative; }
    .text-area * { max-width: 100% !important; box-sizing: border-box !important; }
    .text-area img { width: auto !important; height: auto !important; max-width: 100% !important; display: block; margin: 10px auto; border-radius: 8px; }

    .divider { display: none; border: 0; border-top: 2px dashed var(--border); margin: 30px 0; position: relative; }
    .divider::after { content: "정답"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 10px; color: var(--text-sub); font-size: 0.8rem; font-weight: bold; }
    #answer-section { display: none; padding-bottom: 20px; }

    .footer { width: 100%; padding: 10px 20px; padding-bottom: calc(35px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); z-index: 10; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
    .nav-btns, .grade-btns { display: flex; justify-content: space-between; gap: 12px; }
    .nav-btn, .g-btn { flex: 1; padding: 14px 0; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; text-align: center; border: none; }
    .nav-btn { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); }
    .bg-x { background: #fa5252; color: white; } .bg-tri { background: #fab005; color: white; } .bg-o { background: #40c057; color: white; }
    .click-guide { text-align: center; color: var(--text-sub); font-size: 0.9rem; margin-top: 40px; cursor: pointer; padding: 30px; border: 2px dashed var(--border); border-radius: 12px; background: #181818; pointer-events: auto !important; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; display: none; align-items: center; justify-content: center; }
    .modal-content { background: var(--surface); width: 90%; max-width: 400px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; border: 1px solid var(--border); }
    .edit-input { width: 100%; padding: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 8px; font-family: inherit; font-size: 1rem; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .modal-btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    .btn-save { background: var(--primary); color: white; } .btn-cancel { background: var(--input-bg); color: var(--text); }
    
    .backup-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; background: var(--input-bg); }
    .backup-item { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 0.9rem; }
    
    #loading { margin-top: 50%; color: var(--text-sub); text-align: center; }
    .ox-highlight { font-size: 4rem; font-weight: 900; text-align: center; display: block; margin: 10px 0; }
    .ox-o { color: #40c057; } .ox-x { color: #fa5252; }
</style>
</head>
<body>

<div class="sidebar-overlay" onclick="toggleMenu(false)"></div>
<div class="sidebar" id="sidebar">
    <h2 style="margin-top:0; color:var(--text);">⚙️ 메뉴</h2>
    <div class="menu-section">
        <span class="menu-label">🔍 검색</span>
        <input type="text" id="search-input" class="search-input" placeholder="검색..." onkeyup="filterCards('search')">
    </div>
    <span class="menu-label">📚 덱 목록</span>
    <ul class="deck-list" id="deck-list-ui"></ul>
    <div style="margin-top:auto; border-top:1px solid var(--border); padding-top:20px; padding-bottom:30px;">
        <button class="btn-sub" onclick="exportData()">💾 로컬 백업 저장</button>
        <button class="btn-sub" onclick="document.getElementById('backup-input').click()">📂 로컬 백업 불러오기</button>
        <input type="file" id="backup-input" accept=".json" style="display:none" onchange="importData(this)">
        <button class="btn-cloud" onclick="openGitHubSettings()">☁️ GitHub 자동백업 설정</button>
        <div id="gh-status" style="font-size:0.8rem; color:#888; text-align:center; margin-top:5px;"></div>
        <button class="btn-refresh" onclick="location.reload()">🔄 새로고침</button>
    </div>
</div>

<div class="header">
    <button class="menu-btn" onclick="toggleMenu(true)">☰</button>
    <div class="header-title-area">
        <div class="header-title" id="deck-title">나만의 안키 <span id="cloud-icon" class="cloud-icon">☁️</span></div>
        <div class="header-subtitle" id="header-info">전체</div>
    </div>
    <div class="header-controls">
        <button class="today-toggle-btn active" id="today-toggle-btn" onclick="toggleTodayView()">👁️</button>
        <button class="filter-toggle-btn" id="filter-toggle-btn" onclick="toggleFilterBar()">🌪️</button>
        <span class="counter" id="card-counter">0 / 0</span>
    </div>
</div>

<div id="filter-bar-container">
    <div class="filter-scroll">
        <div class="chip" onclick="setSortMode('wrong')">🔥 틀린순</div>
        <div class="chip" onclick="setSortMode('random')">🎲 랜덤</div>
        <div class="v-divider"></div>
        <div class="chip active" id="chip-default" onclick="filterCards('default')">📁 전체</div>
        <div class="chip" id="chip-rev" onclick="filterCards('rev')">🔄 복습</div>
        <div class="chip" id="chip-fav" onclick="filterCards('fav')">⭐ 중요</div>
        <div class="chip" id="chip-mem" onclick="filterCards('mem')">🧠 암기</div>
    </div>
</div>

<div class="main-container">
    <div class="card">
        <div class="card-scroll-area" id="scroll-area">
            <div class="zoom-content" id="zoom-content">
                <div id="loading" style="display:none;">로딩 중...</div>
                <div class="card-info" id="card-info">
                    <div style="display:flex; align-items:center;">
                        <span class="rate-badge" id="rate-badge">New</span>
                        <span class="date-badge" id="date-badge" style="display:none;"></span>
                    </div>
                    <div class="icon-wrapper">
                        <div class="icon-row">
                            <button class="icon-btn" id="rev-btn" onclick="toggleTag(event, 'rev')">🔄</button>
                            <button class="icon-btn" id="mem-btn" onclick="toggleTag(event, 'mem')">🧠</button>
                            <button class="icon-btn" id="fav-btn" onclick="toggleTag(event, 'fav')">⭐</button>
                        </div>
                    </div>
                </div>
                <div id="question-section" class="text-area"></div>
                <div id="click-guide" class="click-guide" onclick="revealAnswer(event)">👇 정답 확인 (터치)</div>
                <hr id="divider" class="divider">
                <div id="answer-section" class="text-area"></div>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    <div class="grade-btns" id="grade-area">
        <button class="g-btn bg-x" onclick="grade(0)">모름</button>
        <button class="g-btn bg-tri" onclick="grade(1)">애매</button>
        <button class="g-btn bg-o" onclick="grade(2)">맞음</button>
    </div>
    <div class="nav-btns" id="nav-area">
        <button class="nav-btn" onclick="moveCard(-1)">◀ 이전</button>
        <button class="nav-btn" onclick="moveCard(1)">다음 ▶</button>
    </div>
</div>

<div class="modal-overlay" id="gh-modal">
    <div class="modal-content">
        <div class="modal-title">☁️ GitHub 자동 백업</div>
        <div id="gh-auth-ui">
            <input type="text" id="gh-user" class="edit-input" placeholder="GitHub ID">
            <input type="text" id="gh-repo" class="edit-input" style="margin-top:5px;" placeholder="저장소 이름 (예: mk)">
            <input type="password" id="gh-token" class="edit-input" style="margin-top:5px;" placeholder="Token (ghp_...)">
            <div class="modal-btns">
                <button class="modal-btn btn-save" onclick="saveGhSettings()">저장 및 연결</button>
                <button class="modal-btn btn-sub" onclick="fetchBackupList()">복구 목록</button>
                <button class="modal-btn btn-cancel" onclick="closeGhModal()">닫기</button>
            </div>
        </div>
        <div id="gh-list-ui" style="display:none;">
            <div id="backup-list" class="backup-list"></div>
            <div class="modal-btns"><button class="modal-btn btn-cancel" onclick="showAuthUi()">뒤로</button></div>
        </div>
    </div>
</div>

<script>
// v10.77 Core Logic (Stable) + Safe GitHub
const STORAGE_KEY_LIBRARY = 'anki_final_library';
const STORAGE_KEY_STATS = 'anki_final_stats';
const STORAGE_KEY_LAST = 'anki_final_last_deck';

let library = {}, activeDeck = [], currentIndex = 0;
let ghUser = localStorage.getItem('gh_user') || '';
let ghRepo = localStorage.getItem('gh_repo') || '';
let ghToken = localStorage.getItem('gh_token') || '';
let showToday = localStorage.getItem('anki_show_today') !== 'false';
let lastBackup = 0;
let isDirty = false;

window.onload = function() {
    loadLibrary();
    if(Object.keys(library).length > 0) {
        const last = localStorage.getItem(STORAGE_KEY_LAST);
        if(last && library[last]) selectDeck(last);
        else document.getElementById('question-section').innerText = "메뉴에서 덱을 선택하세요.";
    }
    document.getElementById('loading').style.display = 'none';
    if(ghUser && ghRepo) {
        document.getElementById('gh-status').innerText = "✅ 자동 백업 대기 중";
    }
};

// UI Functions
function toggleMenu(force) {
    const sb = document.getElementById('sidebar');
    const ol = document.querySelector('.sidebar-overlay');
    if(force !== undefined) {
        if(force) { sb.classList.add('open'); ol.style.display='block'; }
        else { sb.classList.remove('open'); ol.style.display='none'; }
    } else {
        sb.classList.toggle('open');
        ol.style.display = sb.classList.contains('open') ? 'block' : 'none';
    }
}

function toggleFilterBar() {
    document.getElementById('filter-bar-container').classList.toggle('show');
    document.getElementById('filter-toggle-btn').classList.toggle('active');
}

function toggleTodayView() {
    showToday = !showToday;
    localStorage.setItem('anki_show_today', showToday);
    const btn = document.getElementById('today-toggle-btn');
    btn.innerText = showToday ? "👁️" : "🙈";
    btn.className = showToday ? "today-toggle-btn active" : "today-toggle-btn hidden";
}

// Deck Logic
function loadLibrary() {
    const saved = localStorage.getItem(STORAGE_KEY_LIBRARY);
    if(saved) {
        try { library = JSON.parse(saved); renderDeckList(); } catch(e) {}
    }
}

function renderDeckList() {
    const list = document.getElementById('deck-list-ui');
    list.innerHTML = '';
    Object.keys(library).sort().forEach(name => {
        const li = document.createElement('li');
        li.className = 'tree-deck';
        li.innerText = `📄 ${name} (${library[name].length})`;
        li.onclick = () => selectDeck(name);
        list.appendChild(li);
    });
}

function selectDeck(name) {
    activeDeck = library[name];
    localStorage.setItem(STORAGE_KEY_LAST, name);
    document.getElementById('deck-title').innerText = name;
    currentIndex = 0;
    toggleMenu(false);
    showCard();
}

function showCard() {
    if(!activeDeck || activeDeck.length === 0) return;
    const card = activeDeck[currentIndex];
    const stats = getStats(card.id);
    
    document.getElementById('card-counter').innerText = `${currentIndex+1}/${activeDeck.length}`;
    document.getElementById('question-section').innerHTML = formatText(card.q);
    document.getElementById('answer-section').innerHTML = formatText(card.a);
    
    document.getElementById('answer-section').style.display = 'none';
    document.getElementById('divider').style.display = 'none';
    document.getElementById('click-guide').style.display = 'block';
    document.getElementById('grade-area').style.display = 'none';
    document.getElementById('nav-area').style.display = 'flex';
    
    updateStatsUI(stats);
}

function revealAnswer(e) {
    if(e) e.stopPropagation();
    document.getElementById('click-guide').style.display = 'none';
    document.getElementById('divider').style.display = 'block';
    document.getElementById('answer-section').style.display = 'block';
    document.getElementById('grade-area').style.display = 'flex';
    document.getElementById('nav-area').style.display = 'none';
    document.getElementById('answer-section').scrollIntoView({behavior:'smooth'});
}

function grade(score) {
    const card = activeDeck[currentIndex];
    const stats = getStats(card.id);
    
    stats.total++;
    if(score === 2) stats.correct++;
    else if(score === 1) stats.correct += 0.5;
    stats.last = Date.now();
    
    saveStats(card.id, stats);
    isDirty = true;
    checkAutoBackup(); // 10분 체크 및 백업

    if(!showToday) {
        activeDeck.splice(currentIndex, 1);
        if(currentIndex >= activeDeck.length) currentIndex = 0;
    } else {
        currentIndex = (currentIndex + 1) % activeDeck.length;
    }
    
    if(activeDeck.length === 0) alert("끝!");
    else showCard();
}

function moveCard(d) {
    currentIndex = (currentIndex + d + activeDeck.length) % activeDeck.length;
    showCard();
}

// Stats & Helpers
function getStats(id) { return JSON.parse(localStorage.getItem(STORAGE_KEY_STATS) || '{}')[id] || {correct:0, total:0}; }
function saveStats(id, s) {
    const all = JSON.parse(localStorage.getItem(STORAGE_KEY_STATS) || '{}');
    all[id] = s;
    localStorage.setItem(STORAGE_KEY_STATS, JSON.stringify(all));
}
function updateStatsUI(s) {
    const b = document.getElementById('rate-badge');
    if(!s.total) { b.innerText = "New"; b.style.background='#333'; }
    else {
        const r = Math.round(s.correct/s.total*100);
        b.innerText = `${r}% (${s.total})`;
        b.style.background = r>=80 ? '#0b2e13' : (r<50 ? '#2e0b0b' : '#333');
    }
}
function toggleTag(e, tag) {
    e.stopPropagation();
    const c = activeDeck[currentIndex];
    const s = getStats(c.id);
    s[tag] = !s[tag];
    saveStats(c.id, s);
    document.getElementById(tag+'-btn').classList.toggle('active', s[tag]);
}
function formatText(t) {
    return t.replace(/""/g, '"').replace(/\{\{c\d+::(.*?)\}\}/g, '<span style="color:#fa5252">$1</span>');
}

// 🔥 SAFE GITHUB BACKUP (Isolated)
function openGitHubSettings() {
    document.getElementById('gh-user').value = ghUser;
    document.getElementById('gh-repo').value = ghRepo;
    document.getElementById('gh-token').value = ghToken;
    document.getElementById('gh-modal').style.display = 'flex';
}
function closeGhModal() { document.getElementById('gh-modal').style.display = 'none'; }
function saveGhSettings() {
    ghUser = document.getElementById('gh-user').value;
    ghRepo = document.getElementById('gh-repo').value;
    ghToken = document.getElementById('gh-token').value;
    localStorage.setItem('gh_user', ghUser);
    localStorage.setItem('gh_repo', ghRepo);
    localStorage.setItem('gh_token', ghToken);
    closeGhModal();
    alert("저장되었습니다. 10분마다 자동으로 백업합니다.");
    document.getElementById('gh-status').innerText = "✅ 자동 백업 활성화";
}

async function checkAutoBackup() {
    if(!ghToken || !isDirty) return;
    const now = Date.now();
    if(now - lastBackup < 600000) return; // 10분 제한 (600,000ms)
    
    lastBackup = now;
    isDirty = false;
    document.getElementById('cloud-icon').className = 'cloud-icon active';
    
    try {
        const d = new Date();
        const fname = `mk_${d.getFullYear()}${d.getMonth()+1}${d.getDate()}_${d.getHours()}${d.getMinutes()}.json`;
        const content = btoa(unescape(encodeURIComponent(localStorage.getItem(STORAGE_KEY_STATS))));
        
        // 1. Upload new backup
        await fetch(`https://api.github.com/repos/${ghUser}/${ghRepo}/contents/backups/${fname}`, {
            method: 'PUT',
            headers: {'Authorization': `token ${ghToken}`, 'Content-Type': 'application/json'},
            body: JSON.stringify({message: 'Auto Backup', content: content})
        });
        
        // 2. Cleanup old files (Keep 10)
        const res = await fetch(`https://api.github.com/repos/${ghUser}/${ghRepo}/contents/backups`, {
            headers: {'Authorization': `token ${ghToken}`}
        });
        const files = await res.json();
        const backups = files.filter(f => f.name.startsWith('mk_')).sort((a,b) => a.name.localeCompare(b.name));
        
        if(backups.length > 10) {
            await fetch(backups[0].url, {
                method: 'DELETE',
                headers: {'Authorization': `token ${ghToken}`, 'Content-Type': 'application/json'},
                body: JSON.stringify({message: 'Cleanup', sha: backups[0].sha})
            });
        }
        document.getElementById('cloud-icon').className = 'cloud-icon done';
    } catch(e) {
        console.error("Backup failed silently", e); // 사용자 방해 금지
        document.getElementById('cloud-icon').className = 'cloud-icon';
    }
}

async function fetchBackupList() {
    document.getElementById('gh-auth-ui').style.display = 'none';
    document.getElementById('gh-list-ui').style.display = 'block';
    const list = document.getElementById('backup-list');
    list.innerHTML = '로딩 중...';
    
    try {
        const res = await fetch(`https://api.github.com/repos/${ghUser}/${ghRepo}/contents/backups`, {
            headers: {'Authorization': `token ${ghToken}`}
        });
        const files = await res.json();
        list.innerHTML = '';
        files.filter(f => f.name.startsWith('mk_')).sort((a,b) => b.name.localeCompare(a.name)).forEach(f => {
            const div = document.createElement('div');
            div.className = 'backup-item';
            div.innerText = f.name;
            div.onclick = async () => {
                if(!confirm("이 시점으로 복구하시겠습니까?")) return;
                const r = await fetch(f.url, {headers: {'Authorization': `token ${ghToken}`}});
                const d = await r.json();
                localStorage.setItem(STORAGE_KEY_STATS, decodeURIComponent(escape(atob(d.content))));
                location.reload();
            };
            list.appendChild(div);
        });
    } catch(e) { list.innerText = "목록 불러오기 실패"; }
}
function showAuthUi() { document.getElementById('gh-auth-ui').style.display = 'block'; document.getElementById('gh-list-ui').style.display = 'none'; }

// Utilities
function exportData() {
    const blob = new Blob([localStorage.getItem(STORAGE_KEY_STATS)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup.json'; a.click();
}
function importData(inp) {
    const r = new FileReader();
    r.onload = e => { localStorage.setItem(STORAGE_KEY_STATS, e.target.result); location.reload(); };
    r.readAsText(inp.files[0]);
}
