<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나만의 안키 (v10.84 - Fixed)</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --primary: #4dabf7; --bg: #121212; --surface: #1e1e1e; --text: #e0e0e0; --text-sub: #a0a0a0; --border: #333333; --input-bg: #2c2c2c; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    .header { background: var(--surface); padding: 12px 20px; padding-top: calc(env(safe-area-inset-top) + 12px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 20; }
    .header-title { font-weight: bold; font-size: 1.1rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .header-subtitle { font-size: 0.75rem; color: var(--primary); font-weight: bold; margin-top: 2px; }
    
    .menu-btn, .filter-toggle-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text); padding: 0; }
    .filter-toggle-btn { color: var(--text-sub); transition: 0.2s; }
    .filter-toggle-btn.active { color: var(--primary); }
    .today-toggle-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #40c057; }
    .today-toggle-btn.hidden { color: #fa5252; opacity: 0.7; }
    
    #filter-bar { background: var(--surface); max-height: 0; overflow: hidden; transition: 0.3s; border-bottom: 0px solid var(--border); }
    #filter-bar.show { max-height: 60px; border-bottom: 1px solid var(--border); }
    .filter-scroll { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .chip { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; background: var(--input-bg); color: var(--text-sub); border: 1px solid var(--border); cursor: pointer; }
    .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .main-container { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .card-scroll-area { flex: 1; overflow-y: auto; padding: 20px; }
    .card-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
    .rate-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; background: var(--input-bg); font-weight: bold; }
    
    .icon-row { display: flex; gap: 10px; }
    .icon-btn { font-size: 1.3rem; opacity: 0.3; filter: grayscale(100%); background: none; border: none; padding: 0; cursor: pointer; }
    .icon-btn.active { opacity: 1; filter: grayscale(0%); }

    .text-area { font-size: 1.3rem; line-height: 1.6; word-break: keep-all; white-space: pre-wrap; }
    .text-area img { max-width: 100%; display: block; margin: 10px auto; border-radius: 8px; }
    
    .footer { background: var(--surface); padding: 15px 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
    .nav-btns, .grade-btns { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 14px 0; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; font-size: 1rem; }
    .bg-x { background: #fa5252; color: white; } .bg-tri { background: #fab005; color: white; } .bg-o { background: #40c057; color: white; }
    .nav-btn { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); }

    .click-guide { text-align: center; color: var(--text-sub); padding: 40px; border: 2px dashed var(--border); border-radius: 10px; margin-top: 30px; cursor: pointer; }
    #answer-section, #grade-area { display: none; }
    
    .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9998; display: none; }
    .sidebar { position: fixed; top: 0; left: 0; width: 280px; height: 100%; background: var(--surface); border-right: 1px solid var(--border); z-index: 9999; transform: translateX(-105%); transition: 0.3s; padding: 20px; padding-top: calc(env(safe-area-inset-top) + 20px); display: flex; flex-direction: column; }
    .sidebar.open { transform: translateX(0); }
    
    .deck-list { list-style: none; padding: 0; overflow-y: auto; flex: 1; }
    .tree-deck { padding: 10px; margin-bottom: 5px; background: var(--input-bg); border-radius: 6px; cursor: pointer; }
    .tree-deck.active { border: 1px solid #1c7ed6; background: #182836; color: #74c0fc; }
    
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; display: none; justify-content: center; align-items: center; }
    .modal-content { background: var(--surface); width: 90%; max-width: 400px; padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .input-field { width: 100%; padding: 10px; margin-bottom: 10px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; }
    
    .cloud-icon { font-size: 0.9rem; margin-left: 5px; }
    .cloud-icon.syncing { animation: spin 1s infinite linear; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="sidebar-overlay" onclick="toggleMenu(false)"></div>
<div class="sidebar" id="sidebar">
    <h2 style="margin-top:0;">⚙️ 메뉴</h2>
    <input type="text" id="search-input" class="input-field" placeholder="검색..." onkeyup="filterCards('search')">
    <ul class="deck-list" id="deck-list-ui"></ul>
    <div style="margin-top:20px; border-top:1px solid #333; padding-top:20px;">
        <button class="btn nav-btn" onclick="openGitHubSettings()" style="width:100%; margin-bottom:10px;">☁️ 클라우드 설정</button>
        <button class="btn nav-btn" onclick="location.reload()" style="width:100%;">🔄 새로고침</button>
    </div>
</div>

<div class="header">
    <button class="menu-btn" onclick="toggleMenu(true)">☰</button>
    <div style="flex:1; margin:0 15px;">
        <div class="header-title" id="deck-title">나만의 안키 <span id="cloud-icon" class="cloud-icon">☁️</span></div>
        <div class="header-subtitle" id="header-info">전체</div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
        <button class="today-toggle-btn active" id="today-btn" onclick="toggleToday()">👁️</button>
        <button class="filter-toggle-btn" id="filter-btn" onclick="toggleFilter()">🌪️</button>
        <span style="font-size:0.8rem; font-weight:bold; background:#333; padding:4px 8px; border-radius:10px;" id="cnt">0/0</span>
    </div>
</div>

<div id="filter-bar">
    <div class="filter-scroll">
        <div class="chip" onclick="setSort('wrong')">🔥 틀린순</div>
        <div class="chip" onclick="setSort('random')">🎲 랜덤</div>
        <div style="width:1px; background:#444; margin:0 5px;"></div>
        <div class="chip active" id="chip-default" onclick="setFilter('default')">📁 전체</div>
        <div class="chip" id="chip-rev" onclick="setFilter('rev')">🔄 복습</div>
        <div class="chip" id="chip-fav" onclick="setFilter('fav')">⭐ 중요</div>
        <div class="chip" id="chip-mem" onclick="setFilter('mem')">🧠 암기</div>
        <div class="chip" id="chip-rate_asc" onclick="setFilter('rate_asc')">🔥 오답</div>
    </div>
</div>

<div class="main-container">
    <div class="card-scroll-area" id="scroll-area">
        <div id="loading" style="text-align:center; margin-top:50%;">로딩 중...</div>
        <div id="card-content" style="display:none;">
            <div class="card-info">
                <span class="rate-badge" id="rate-badge">New</span>
                <div class="icon-row">
                    <button class="icon-btn" id="btn-fav" onclick="toggleTag('fav')">⭐</button>
                    <button class="icon-btn" id="btn-mem" onclick="toggleTag('mem')">🧠</button>
                    <button class="icon-btn" id="btn-rev" onclick="toggleTag('rev')">🔄</button>
                </div>
            </div>
            <div id="q-area" class="text-area"></div>
            <div id="click-guide" class="click-guide" onclick="reveal()">👇 정답 확인 (터치)</div>
            <hr id="divider" style="display:none; border:0; border-top:1px dashed #444; margin:30px 0;">
            <div id="answer-section" class="text-area"></div>
        </div>
    </div>
</div>

<div class="footer">
    <div class="grade-btns" id="grade-area">
        <button class="btn bg-x" onclick="grade(0)">모름</button>
        <button class="btn bg-tri" onclick="grade(1)">애매</button>
        <button class="btn bg-o" onclick="grade(2)">맞음</button>
    </div>
    <div class="nav-btns" id="nav-area">
        <button class="btn nav-btn" onclick="move(-1)">◀ 이전</button>
        <button class="btn nav-btn" onclick="move(1)">다음 ▶</button>
    </div>
</div>

<div class="modal-overlay" id="gh-modal">
    <div class="modal-content">
        <h3>GitHub 연동</h3>
        <input type="text" id="gh-id" class="input-field" placeholder="아이디">
        <input type="text" id="gh-repo" class="input-field" placeholder="저장소 이름 (예: mk)">
        <input type="password" id="gh-token" class="input-field" placeholder="토큰 (ghp_...)">
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
            <button class="btn bg-o" style="padding:10px;" onclick="saveSettings()">저장 및 연동</button>
            <button class="btn nav-btn" style="padding:10px;" onclick="closeModal()">닫기</button>
        </div>
    </div>
</div>

<script>
// 핵심 변수 및 함수
const IDS = { lib: 'anki_lib', stats: 'anki_stats', prog: 'anki_prog', last: 'anki_last' };
let library = {}, activeDeck = [], currentDeckName = null, currentIndex = 0;
let ghUser = localStorage.getItem('gh_user') || '', ghRepo = localStorage.getItem('gh_repo') || '', ghToken = localStorage.getItem('gh_token') || '';
let showToday = localStorage.getItem('anki_show_today') !== 'false';
let filterType = 'default', sortMode = 'wrong';

// 1. 초기화 (가장 중요)
window.onload = function() {
    try {
        const saved = localStorage.getItem(IDS.lib);
        if(saved) { library = JSON.parse(saved); renderTree(); restoreSession(); }
        else { document.getElementById('q-area').innerHTML = "<div style='text-align:center; color:#888'>메뉴에서 덱을 선택하세요.</div>"; }
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('card-content').style.display = 'block';
        
        if(ghUser && ghRepo) scanGitHub();
        updateHeader();
    } catch(e) { alert("초기화 오류: " + e); }
};

// 2. UI 동작 함수 (버튼 연결)
function toggleMenu(open) {
    const sb = document.getElementById('sidebar');
    const ol = document.querySelector('.sidebar-overlay');
    if(open) { sb.classList.add('open'); ol.style.display = 'block'; }
    else { sb.classList.remove('open'); ol.style.display = 'none'; }
}

function toggleFilter() {
    const bar = document.getElementById('filter-bar');
    const btn = document.getElementById('filter-btn');
    bar.classList.toggle('show');
    btn.classList.toggle('active');
}

function toggleToday() {
    showToday = !showToday;
    localStorage.setItem('anki_show_today', showToday);
    const btn = document.getElementById('today-btn');
    btn.innerText = showToday ? "👁️" : "🙈";
    btn.className = `today-toggle-btn ${showToday?'active':'hidden'}`;
    applyFilter();
}

function reveal() {
    document.getElementById('click-guide').style.display = 'none';
    document.getElementById('divider').style.display = 'block';
    document.getElementById('answer-section').style.display = 'block';
    document.getElementById('grade-area').style.display = 'flex';
    document.getElementById('nav-area').style.display = 'none';
    document.getElementById('answer-section').scrollIntoView({behavior:'smooth'});
}

function grade(score) {
    if(!activeDeck.length) return;
    const card = activeDeck[currentIndex];
    const stats = getStats(card.id);
    
    stats.total++;
    if(score === 2) stats.correct++;
    else if(score === 1) stats.correct += 0.5;
    stats.last = Date.now();
    
    saveStats(card.id, stats);
    autoBackup(); // 자동 백업 트리거

    // 다음 카드로 이동 로직
    if(!showToday) {
        // 오늘 완료 숨김 모드면 리스트에서 제거
        activeDeck.splice(currentIndex, 1);
        if(currentIndex >= activeDeck.length) currentIndex = 0;
    } else {
        currentIndex++;
        if(currentIndex >= activeDeck.length) currentIndex = 0;
    }
    
    showCard();
}

function move(delta) {
    if(!activeDeck.length) return;
    currentIndex = (currentIndex + delta + activeDeck.length) % activeDeck.length;
    showCard();
}

// 3. 핵심 로직
function showCard() {
    if(!activeDeck.length) {
        document.getElementById('q-area').innerHTML = "<div style='text-align:center; padding:50px;'>🎉 학습 완료!</div>";
        document.getElementById('answer-section').style.display = 'none';
        document.getElementById('click-guide').style.display = 'none';
        document.getElementById('grade-area').style.display = 'none';
        document.getElementById('cnt').innerText = "0/0";
        return;
    }
    
    const card = activeDeck[currentIndex];
    const stats = getStats(card.id);
    
    document.getElementById('cnt').innerText = `${currentIndex+1}/${activeDeck.length}`;
    document.getElementById('q-area').innerHTML = formatText(card.q);
    document.getElementById('answer-section').innerHTML = formatText(card.a);
    
    // UI 초기화
    document.getElementById('click-guide').style.display = 'block';
    document.getElementById('divider').style.display = 'none';
    document.getElementById('answer-section').style.display = 'none';
    document.getElementById('grade-area').style.display = 'none';
    document.getElementById('nav-area').style.display = 'flex';
    document.getElementById('scroll-area').scrollTop = 0;
    
    // 뱃지 및 아이콘 업데이트
    const rate = stats.total ? Math.round(stats.correct/stats.total*100) : 0;
    const badge = document.getElementById('rate-badge');
    badge.innerText = stats.total ? `${rate}% (${stats.total}회)` : "New";
    badge.style.background = stats.total ? (rate>=80?'#0b2e13':(rate<50?'#2e0b0b':'#1e1e1e')) : '#2c2c2c';
    badge.style.color = stats.total ? (rate>=80?'#69db7c':(rate<50?'#ff8787':'#aaa')) : '#aaa';
    
    ['fav','mem','rev'].forEach(t => {
        document.getElementById(`btn-${t}`).className = `icon-btn ${stats[t]?'active':''}`;
    });
}

function applyFilter() {
    if(!currentDeckName || !originalDeck) return;
    let list = [...originalDeck];
    const allStats = JSON.parse(localStorage.getItem(IDS.stats) || '{}');
    
    // 필터 적용
    if(filterType === 'rate_asc') list = list.filter(c => { const s = allStats[c.id]||{t:0,c:0}; return s.t>0 && (s.c/s.t)<0.8; });
    else if(filterType !== 'default') list = list.filter(c => (allStats[c.id]||{})[filterType]);
    
    // 오늘 완료 숨김
    if(!showToday) {
        const today = new Date(); today.setHours(4,0,0,0);
        list = list.filter(c => (allStats[c.id]?.last || 0) < today.getTime());
    }
    
    // 정렬
    if(sortMode === 'wrong') {
        list.sort((a,b) => {
            const sA = allStats[a.id]||{c:0,t:0}, sB = allStats[b.id]||{c:0,t:0};
            const rA = sA.t ? sA.c/sA.t : 0, rB = sB.t ? sB.c/sB.t : 0;
            return rA - rB;
        });
    } else if(sortMode === 'random') {
        list.sort(() => Math.random() - 0.5);
    }
    
    activeDeck = list;
    currentIndex = 0;
    showCard();
    updateHeader();
}

function setFilter(type) {
    filterType = type;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    document.getElementById(`chip-${type}`).classList.add('active');
    applyFilter();
}

function setSort(mode) {
    sortMode = mode;
    applyFilter();
}

function updateHeader() {
    const fName = document.getElementById(`chip-${filterType}`)?.innerText || filterType;
    document.getElementById('header-info').innerText = `${originalDeck.length}개 중 ${activeDeck.length}개 (${fName})`;
}

// 4. 데이터 관리
function getStats(id) { return JSON.parse(localStorage.getItem(IDS.stats) || '{}')[id] || {correct:0, total:0, last:0}; }
function saveStats(id, stats) {
    const all = JSON.parse(localStorage.getItem(IDS.stats) || '{}');
    all[id] = stats;
    localStorage.setItem(IDS.stats, JSON.stringify(all));
}
function toggleTag(tag) {
    const c = activeDeck[currentIndex];
    const s = getStats(c.id);
    s[tag] = !s[tag];
    saveStats(c.id, s);
    showCard();
}

function formatText(txt) {
    if(!txt) return "";
    let clean = txt.replace(/""/g, '"').replace(/\{\{c\d+::(.*?)\}\}/g, '<span style="color:#fa5252; font-weight:bold;">$1</span>');
    if(clean.startsWith('"') && clean.endsWith('"')) clean = clean.slice(1, -1);
    
    // 이미지 처리
    const div = document.createElement('div'); div.innerHTML = clean;
    div.querySelectorAll('img').forEach(img => {
        let src = img.getAttribute('src');
        if(src && !src.startsWith('http') && ghUser) {
            img.src = `https://raw.githubusercontent.com/${ghUser}/${ghRepo}/main/images/${src.split('/').pop()}`;
        }
    });
    return div.innerHTML;
}

// 5. 깃허브 연동 및 백업
async function scanGitHub() {
    if(!ghUser || !ghRepo) return;
    try {
        document.getElementById('cloud-icon').classList.add('syncing');
        const url = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/`;
        const headers = ghToken ? {'Authorization': `token ${ghToken}`} : {};
        const res = await fetch(url, {headers});
        if(!res.ok) throw new Error();
        const files = await res.json();
        const txts = files.filter(f => f.name.endsWith('.txt'));
        
        if(txts.length === 0) return;
        
        let newLib = {};
        for(const f of txts) {
            const r = await fetch(f.download_url + '?t=' + Date.now());
            const t = await r.text();
            processText(t, f.name, newLib);
        }
        
        library = newLib;
        localStorage.setItem(IDS.lib, JSON.stringify(library));
        renderTree();
        document.getElementById('cloud-icon').classList.remove('syncing');
        document.getElementById('cloud-icon').classList.add('done');
    } catch(e) { 
        document.getElementById('cloud-icon').classList.remove('syncing');
        document.getElementById('cloud-icon').classList.add('error');
    }
}

function processText(txt, fname, lib) {
    const rows = parseCSV(txt);
    const dName = fname.replace('.txt','');
    rows.forEach(r => {
        if(r.length < 2 || r[0].startsWith('#')) return;
        let q = r[0], a = r[1];
        if(r.length >= 3) { q = r[1]; a = r.slice(2).join('<br>'); }
        if(!q) return;
        if(!lib[dName]) lib[dName] = [];
        lib[dName].push({id: cyrb53(q), q, a});
    });
}

function parseCSV(str) {
    const arr = []; let row = [], col = '', quote = false;
    for(let c of str) {
        if(quote) { if(c === '"') quote = false; else col += c; }
        else { if(c === '"') quote = true; else if(c === '\t') { row.push(col); col = ''; } else if(c === '\n') { row.push(col); arr.push(row); row = []; col = ''; } else col += c; }
    }
    if(col) row.push(col); if(row.length) arr.push(row);
    return arr;
}

// 자동 백업 (10분 제한)
let lastBackup = 0;
async function autoBackup() {
    if(!ghToken || Date.now() - lastBackup < 600000) return; // 10분
    lastBackup = Date.now();
    
    const d = new Date();
    const fname = `mk_${d.getFullYear()}${d.getMonth()+1}${d.getDate()}${d.getHours()}${d.getMinutes()}.json`;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({
        stats: localStorage.getItem(IDS.stats),
        timestamp: Date.now()
    }))));
    
    try {
        await fetch(`https://api.github.com/repos/${ghUser}/${ghRepo}/contents/backups/${fname}`, {
            method: 'PUT',
            headers: {'Authorization': `token ${ghToken}`, 'Content-Type': 'application/json'},
            body: JSON.stringify({message:'Auto', content})
        });
        // 오래된 백업 삭제 로직은 생략 (코드 길이 안전상)
    } catch(e) {}
}

// 설정 관련
function openGitHubSettings() { document.getElementById('gh-modal').style.display = 'flex'; }
function closeModal() { document.getElementById('gh-modal').style.display = 'none'; }
function saveSettings() {
    ghUser = document.getElementById('gh-id').value;
    ghRepo = document.getElementById('gh-repo').value;
    ghToken = document.getElementById('gh-token').value;
    localStorage.setItem('gh_user', ghUser);
    localStorage.setItem('gh_repo', ghRepo);
    localStorage.setItem('gh_token', ghToken);
    closeModal();
    scanGitHub();
    alert("저장되었습니다. 연동을 시작합니다.");
}

function renderTree() {
    const list = document.getElementById('deck-list-ui');
    list.innerHTML = '';
    Object.keys(library).sort().forEach(k => {
        const li = document.createElement('li');
        li.className = `tree-deck ${currentDeckName===k?'active':''}`;
        li.innerText = `📄 ${k} (${library[k].length})`;
        li.onclick = () => {
            currentDeckName = k;
            originalDeck = library[k];
            toggleMenu(false);
            document.getElementById('deck-title').innerText = k;
            setFilter('default');
            renderTree();
        };
        list.appendChild(li);
    });
}

function restoreSession() {
    if(currentDeckName && library[currentDeckName]) {
        originalDeck = library[currentDeckName];
        setFilter(filterType);
    }
}
